<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Femmaction Chartres - Solidarité et Émancipation des Femmes</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #D81B60; /* Fuchsia / Magenta Femmaction */
            --primary-dark: #AD1457; /* Fuchsia foncé */
            --purple-deep: #6A1B9A; /* Violet profond */
            --purple-dark: #4A148C; /* Violet très sombre */
            --accent: #E91E63; /* Rose vif */
            --bg-light: #FCE4EC; /* Rose très pâle */
            --text-main: #2D3748;
            --text-light: #718096;
            --white: #FFFFFF;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif, 'Poppins';
            color: var(--text-main);
            background-color: #FAFAFA;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* HEADER & NAVIGATION */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(106, 27, 154, 0.08);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--purple-deep);
        }

        .logo span {
            color: var(--primary);
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--purple-deep), var(--primary));
            color: var(--white);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            font-weight: 500;
            color: var(--text-main);
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--primary);
        }

        .social-header {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .social-header a {
            width: 34px;
            height: 34px;
            background: var(--bg-light);
            color: var(--purple-deep);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .social-header a:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
        }

        .btn-header {
            background: linear-gradient(135deg, var(--primary), var(--purple-deep));
            color: var(--white) !important;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
            transition: var(--transition);
        }

        .btn-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(216, 27, 96, 0.4);
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            padding: 13rem 5% 9rem 5%;
            background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-deep) 50%, var(--primary-dark) 100%);
            color: var(--white);
            text-align: center;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(233,30,99,0.25) 0%, transparent 70%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 850px;
            margin: 0 auto;
        }
