        * {

        body {

        /* Entête & Navigation */
        header {
            background: linear-gradient(135deg, var(--rouge-primaire), var(--violet-profond));

            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-placeholder {
            width: 100px;
            height: 100px;
            background-color: var(--blanc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-placeholder i {
            font-size: 3rem;
            color: var(--rouge-primaire);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;

        header p.tagline {

        /* Conteneur principal */
        .container {

        /* Cards & Sections */
        section {
            background: var(--blanc);
            border-radius: 12px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        h2.section-title {
            color: var(--rouge-primaire);
            font-size: 1.8rem;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 10px;
        }

        h2.section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(to right, var(--rouge-primaire), var(--violet-profond));
            border-radius: 2px;
        }

        /* Grille des projets */
        .projets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .projet-card {
            background: #fff8f8;
            border-top: 4px solid var(--rouge-primaire);
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .projet-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }

        .projet-card.bel-air {
            border-top-color: var(--violet-profond);
            background: #fcf8ff;
        }

        .projet-card h3 {
            color: var(--fuchsia-sombre);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .projet-card.bel-air h3 {
            color: var(--violet-profond);
        }

        .avis-grid {
            display: grid;

            gap: 20px;
        }

            background: #f9f9f9;
            border-left: 4px solid var(--fuchsia-sombre);
            padding: 20px;
            border-radius: 4px;
            font-style: italic;
            position: relative;
        }

        .avis-card p {
            margin-bottom: 10px;
        }

            font-style: normal;
            font-weight: 600;
            color: var(--violet-profond);
            text-align: right;

        }
